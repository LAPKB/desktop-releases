name: Publish download artifact

# Called by product repositories after they have built (and, where applicable,
# signed) a release artifact. Validates and publishes through the shared
# download origin; holds the only copy of the publisher credential.

on:
  workflow_call:
    inputs:
      app:
        description: Product id, e.g. launcher, papir, bestdose, bdautodial
        required: true
        type: string
      channel:
        description: Release channel
        required: false
        default: stable
        type: string
      version:
        description: Semantic version being published
        required: true
        type: string
      artifact-file:
        description: Release artifact file name inside the downloaded artifact
        required: true
        type: string
      manifest-file:
        description: Signed release manifest file name inside the downloaded artifact
        required: true
        type: string
      artifact-name:
        description: Uploaded workflow artifact holding both files
        required: true
        type: string
      legacy-path:
        description: Previously compiled manifest path that must keep serving identical bytes
        required: false
        default: ''
        type: string
    secrets:
      PUBLISH_SSH_KEY:
        description: Deploy key restricted to the download origin directory
        required: true
      PUBLISH_KNOWN_HOSTS:
        description: Pinned host key for the download origin
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAPKB_PUBLISH_HOST: ${{ vars.LAPKB_DOWNLOAD_HOST }}
      LAPKB_PUBLISH_USER: ${{ vars.LAPKB_DOWNLOAD_USER }}
      LAPKB_PUBLISH_ROOT: ${{ vars.LAPKB_DOWNLOAD_ROOT }}
      LAPKB_PUBLISH_ORIGIN: ${{ vars.LAPKB_DOWNLOAD_ORIGIN }}
      LAPKB_PUBLISH_KEY: ${{ github.workspace }}/lapkb-publish-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: incoming
      - name: Install the restricted publisher key
        env:
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
          PUBLISH_KNOWN_HOSTS: ${{ secrets.PUBLISH_KNOWN_HOSTS }}
        run: |
          set -eu
          printf '%s\n' "$PUBLISH_SSH_KEY" > "$LAPKB_PUBLISH_KEY"
          chmod 0600 "$LAPKB_PUBLISH_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PUBLISH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Validate the artifact set
        run: |
          set -eu
          printf '%s\n' "${{ inputs.version }}" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test -s "incoming/${{ inputs.artifact-file }}"
          test -s "incoming/${{ inputs.manifest-file }}"
          for name in LAPKB_PUBLISH_HOST LAPKB_PUBLISH_USER LAPKB_PUBLISH_ROOT LAPKB_PUBLISH_ORIGIN; do
            test -n "$(printenv "$name")" || { echo "missing repository variable: $name" >&2; exit 1; }
          done
      - name: Publish and verify through the public origin
        run: |
          set -eu
          python3 scripts/publish_artifact.py \
            --app "${{ inputs.app }}" \
            --channel "${{ inputs.channel }}" \
            --version "${{ inputs.version }}" \
            --artifact "incoming/${{ inputs.artifact-file }}" \
            --manifest "incoming/${{ inputs.manifest-file }}" \
            ${{ inputs.legacy-path != '' && format('--legacy {0}', inputs.legacy-path) || '' }}
      - name: Remove the publisher key
        if: always()
        run: rm -f "$LAPKB_PUBLISH_KEY"

name: Validate desktop release metadata

on:
  push:
    branches: [main, launcher]
  pull_request:
    branches: [main, launcher]
  workflow_dispatch:
    inputs:
      runner_arch:
        description: Native Linux verifier architecture
        type: choice
        options: [X64, ARM64]
        default: X64

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository == 'LAPKB/desktop-releases' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/launcher' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: ${{ inputs.runner_arch == 'ARM64' && 'rust' || 'Default' }}
      labels: [self-hosted, Linux, "${{ inputs.runner_arch || 'X64' }}"]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_TERMINAL_PROMPT: "0"
      PUBLISHER_NATIVE_EXPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_arch == 'ARM64' }}
      PUBLISHER_TOOLCHAIN: 1.97.1-aarch64-unknown-linux-gnu
      PUBLISHER_RUST_TARGET: aarch64-unknown-linux-musl
    steps:
      - name: Check out the exact reviewed metadata commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false

      - name: Create an identity-bound private jobs2 directory
        id: private_job
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          job="$(mktemp -d "$RUNNER_TEMP/publisher-jobs2.XXXXXXXXXX")"
          job="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$job")"
          chmod 700 "$job"
          identity="$(python3 -c 'import os,sys; s=os.lstat(sys.argv[1]); print(f"{s.st_dev}:{s.st_ino}")' "$job")"
          printf 'directory=%s\nidentity=%s\n' "$job" "$identity" >> "$GITHUB_OUTPUT"
          python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$job" publisher-jobs2 "$identity"
          mkdir -m 700 "$job/source" "$job/evidence"
          git archive "$GITHUB_SHA" | tar -xf - -C "$job/source"
          if [ "$PUBLISHER_NATIVE_EXPORT" = true ]; then
            test "$RUNNER_OS" = Linux
            test "$RUNNER_ARCH" = ARM64
            test "$(uname -m)" = aarch64
            # Reuse the Rust worker's rustup, never bootstrap/install global tools.
            command -v rustup
            command -v readelf
            mkdir -m 700 "$job/home" "$job/cargo" "$job/rustup" "$job/target" "$job/tmp" "$job/cache"
            printf 'HOME=%s/home\nCARGO_HOME=%s/cargo\nRUSTUP_HOME=%s/rustup\nCARGO_TARGET_DIR=%s/target\nTMPDIR=%s/tmp\nXDG_CACHE_HOME=%s/cache\n' \
              "$job" "$job" "$job" "$job" "$job" "$job" >> "$GITHUB_ENV"
            printf 'CARGO_INCREMENTAL=0\nCARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse\nGIT_CONFIG_GLOBAL=/dev/null\nGIT_CONFIG_NOSYSTEM=1\nGIT_SSH_COMMAND=/usr/bin/false\n' >> "$GITHUB_ENV"
          fi

      - name: Install the existing CI-pinned Rust toolchain privately
        if: github.event_name == 'workflow_dispatch' && inputs.runner_arch == 'ARM64'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.PUBLISHER_TOOLCHAIN }}
          targets: ${{ env.PUBLISHER_RUST_TARGET }}

      - name: Fetch only locked verifier dependencies without credentials
        if: github.event_name == 'workflow_dispatch' && inputs.runner_arch == 'ARM64'
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          JOB_DIRECTORY: ${{ steps.private_job.outputs.directory }}
          JOB_IDENTITY: ${{ steps.private_job.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$JOB_DIRECTORY" publisher-jobs2 "$JOB_IDENTITY"
          tools="$RUSTUP_HOME/toolchains/$PUBLISHER_TOOLCHAIN/bin"
          test -x "$tools/cargo"
          test -x "$tools/rustc"
          env -i PATH="$tools:/usr/bin:/bin" HOME="$HOME" CARGO_HOME="$CARGO_HOME" \
            RUSTUP_HOME="$RUSTUP_HOME" CARGO_TARGET_DIR="$CARGO_TARGET_DIR" TMPDIR="$TMPDIR" \
            XDG_CACHE_HOME="$XDG_CACHE_HOME" CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 \
            CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse GIT_TERMINAL_PROMPT=0 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_SSH_COMMAND=/usr/bin/false \
            cargo fetch --locked --target "$PUBLISHER_RUST_TARGET" \
              --manifest-path "$JOB_DIRECTORY/source/host/verifier/Cargo.toml"

      - name: Build and test only the native verifier offline, then record its actual ABI
        if: github.event_name == 'workflow_dispatch' && inputs.runner_arch == 'ARM64'
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          JOB_DIRECTORY: ${{ steps.private_job.outputs.directory }}
          JOB_IDENTITY: ${{ steps.private_job.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export LC_ALL=C
          python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$JOB_DIRECTORY" publisher-jobs2 "$JOB_IDENTITY"
          tools="$RUSTUP_HOME/toolchains/$PUBLISHER_TOOLCHAIN/bin"
          "$tools/rustc" --version --verbose > "$JOB_DIRECTORY/rustc-version.txt"
          grep -qx 'release: 1.97.1' "$JOB_DIRECTORY/rustc-version.txt"
          grep -qx 'host: aarch64-unknown-linux-gnu' "$JOB_DIRECTORY/rustc-version.txt"
          sysroot="$("$tools/rustc" --print sysroot)"
          test "$sysroot" = "$RUSTUP_HOME/toolchains/$PUBLISHER_TOOLCHAIN"
          # Rust's pinned musl std/CRT and bundled LLD need no system musl/GCC install.
          linker="$sysroot/lib/rustlib/aarch64-unknown-linux-gnu/bin/rust-lld"
          test -x "$linker"
          native_env=(env -i PATH="$tools:/usr/bin:/bin" HOME="$HOME" CARGO_HOME="$CARGO_HOME"
            RUSTUP_HOME="$RUSTUP_HOME" CARGO_TARGET_DIR="$CARGO_TARGET_DIR" TMPDIR="$TMPDIR"
            XDG_CACHE_HOME="$XDG_CACHE_HOME" CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0
            CARGO_NET_OFFLINE=true GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL=/dev/null
            GIT_CONFIG_NOSYSTEM=1 GIT_SSH_COMMAND=/usr/bin/false
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$linker"
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS='-C linker-flavor=ld.lld -C link-self-contained=yes -C target-feature=+crt-static')
          "${native_env[@]}" cargo build --release --locked --offline --jobs 2 \
            --bin lapkb-release-verifier --target "$PUBLISHER_RUST_TARGET" \
            --manifest-path "$JOB_DIRECTORY/source/host/verifier/Cargo.toml"
          # Only this binary's Rust unit tests; never compile/run the signer example
          # or the container-only fixed-path publisher/Python fixture on the host.
          "${native_env[@]}" cargo test --release --locked --offline --jobs 2 \
            --bin lapkb-release-verifier --target "$PUBLISHER_RUST_TARGET" \
            --manifest-path "$JOB_DIRECTORY/source/host/verifier/Cargo.toml"
          cmp "$JOB_DIRECTORY/source/host/verifier/Cargo.lock" host/verifier/Cargo.lock
          binary="$CARGO_TARGET_DIR/$PUBLISHER_RUST_TARGET/release/lapkb-release-verifier"
          readelf --file-header "$binary" > "$JOB_DIRECTORY/elf-header.txt"
          readelf --program-headers --wide "$binary" > "$JOB_DIRECTORY/elf-program-headers.txt"
          readelf --dynamic --wide "$binary" > "$JOB_DIRECTORY/elf-dynamic.txt"
          grep -Eq 'Class: +ELF64' "$JOB_DIRECTORY/elf-header.txt"
          grep -Eq "Data: +2's complement, little endian" "$JOB_DIRECTORY/elf-header.txt"
          grep -Eq 'Machine: +AArch64' "$JOB_DIRECTORY/elf-header.txt"
          grep -Eq 'Type: +(EXEC|DYN) ' "$JOB_DIRECTORY/elf-header.txt"
          if grep -q 'INTERP' "$JOB_DIRECTORY/elf-program-headers.txt" \
            || grep -q '(NEEDED)' "$JOB_DIRECTORY/elf-dynamic.txt"; then
            echo 'Refusing export: verifier requires an external loader/shared library' >&2
            exit 1
          fi
          install -m 700 "$binary" "$JOB_DIRECTORY/evidence/lapkb-release-verifier"
          (cd "$JOB_DIRECTORY/evidence" && sha256sum lapkb-release-verifier > lapkb-release-verifier.sha256)
          {
            printf 'publisher-source=%s\nrun=%s\nattempt=%s\nrun-url=%s/%s/actions/runs/%s\nrunner=%s\nrunner-group=rust\nrust-toolchain=%s\nrust-target=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID" "$RUNNER_NAME" "$PUBLISHER_TOOLCHAIN" "$PUBLISHER_RUST_TARGET"
            printf 'abi=ELF64 little-endian Linux AArch64 static musl\nexternal-loader=none\nshared-library-requirements=none\njobs=2\nbuild=release locked offline bin-only\nchecks=native Rust verifier unit tests passed\nfull-publisher-regressions=not run; retained in default X64 Docker validation\nproduct-signing-publication-native-Windows=not performed\n'
            (cd "$JOB_DIRECTORY/source" && sha256sum host/verifier/Cargo.toml host/verifier/Cargo.lock host/verifier/src/main.rs)
            cat "$JOB_DIRECTORY/rustc-version.txt"
            "$tools/cargo" --version --verbose
            cat "$JOB_DIRECTORY/elf-header.txt" "$JOB_DIRECTORY/elf-program-headers.txt" "$JOB_DIRECTORY/elf-dynamic.txt"
            cat "$JOB_DIRECTORY/evidence/lapkb-release-verifier.sha256"
          } > "$JOB_DIRECTORY/evidence/publisher-checks.txt"

      - name: Run only publisher checks in pinned credential-free networkless test layers
        if: github.event_name != 'workflow_dispatch' || inputs.runner_arch != 'ARM64'
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          JOB_DIRECTORY: ${{ steps.private_job.outputs.directory }}
          JOB_IDENTITY: ${{ steps.private_job.outputs.identity }}
          PUBLISHER_ARCH: ${{ inputs.runner_arch || 'X64' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ARCH" = "$PUBLISHER_ARCH"
          case "$PUBLISHER_ARCH" in
            X64) platform=linux/amd64 ;;
            ARM64) platform=linux/arm64 ;;
            *) exit 1 ;;
          esac
          python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$JOB_DIRECTORY" publisher-jobs2 "$JOB_IDENTITY"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          unset DOCKER_HOST DOCKER_CONTEXT DOCKER_CONFIG BUILDX_CONFIG BUILDX_BUILDER BUILDKIT_HOST \
            DOCKER_TLS DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_AUTH_CONFIG SSH_AUTH_SOCK
          private_config="$JOB_DIRECTORY/docker"
          docker_mode=''
          docker_argv=()
          builder=''
          builder_creation_started=0

          cleanup_docker() {
            local status=$?
            trap - EXIT HUP INT TERM
            set +e
            if ! python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$JOB_DIRECTORY" publisher-jobs2 "$JOB_IDENTITY" root-or-runner; then
              echo 'Refusing Docker cleanup outside the identity-validated private job' >&2
              if [[ "$status" == 0 ]]; then status=1; fi
              exit "$status"
            fi
            if [[ "$builder_creation_started" == 1 ]]; then
              if ! "${docker_argv[@]}" buildx rm --force "$builder" >/dev/null; then
                printf "Could not remove this job's Buildx builder/cache: %s\n" "$builder" >&2
                if [[ "$status" == 0 ]]; then status=1; fi
              fi
            fi
            if [[ "$docker_mode" == sudo ]]; then
              # Restore only root-owned entries here, including partial failed exports.
              if ! python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$JOB_DIRECTORY" publisher-jobs2 "$JOB_IDENTITY" root-or-runner \
                || ! sudo -n -- /usr/bin/chown -R --no-dereference --from=0 "$runner_uid:$runner_gid" -- "$JOB_DIRECTORY"; then
                echo 'Scoped ownership restoration failed for this private job' >&2
                if [[ "$status" == 0 ]]; then status=1; fi
              fi
            fi
            if ! python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$JOB_DIRECTORY" publisher-jobs2 "$JOB_IDENTITY"; then
              echo 'Private job did not return to validated runner ownership' >&2
              if [[ "$status" == 0 ]]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup_docker EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Buildx defaults to this private Docker config's buildx child, even under sudo.
          mkdir -m 700 "$private_config" "$private_config/buildx"
          random_suffix="$(od -An -N16 -tx1 /dev/urandom | tr -d '[:space:]')"
          [[ "$random_suffix" =~ ^[0-9a-f]{32}$ ]]
          builder="publisher-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${random_suffix}"
          docker_flags=(--host unix:///var/run/docker.sock --config "$private_config")
          direct_docker_argv=(/usr/bin/docker "${docker_flags[@]}")
          if "${direct_docker_argv[@]}" version >/dev/null 2>&1; then
            docker_argv=("${direct_docker_argv[@]}")
            docker_mode=direct
          else
            docker_argv=(sudo -n -- /usr/bin/docker "${docker_flags[@]}")
            docker_mode=sudo
          fi
          builder_creation_started=1
          "${docker_argv[@]}" buildx create --name "$builder" --driver docker-container >/dev/null
          "${docker_argv[@]}" buildx inspect "$builder" --bootstrap >/dev/null
          "${docker_argv[@]}" buildx build --builder "$builder" --platform "$platform" --file "$JOB_DIRECTORY/source/scripts/ci/publisher.Dockerfile" \
            --target ci-evidence --build-arg PUBLISHER_SOURCE_SHA="$GITHUB_SHA" \
            --build-arg PUBLISHER_RUN_ID="$GITHUB_RUN_ID" --build-arg PUBLISHER_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            --output "type=local,dest=$JOB_DIRECTORY/evidence" --progress plain "$JOB_DIRECTORY/source"

      # A deliberate one-time integration push marker enables setup in this
      # maintained validation lane; normal validation never installs tools.
      - name: Verify and provision the pinned native release tools on X64
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/launcher' &&
          contains(github.event.head_commit.message, '[release-tools-setup]')
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          JOB_DIRECTORY: ${{ steps.private_job.outputs.directory }}
          JOB_IDENTITY: ${{ steps.private_job.outputs.identity }}
        run: python3 scripts/ci/release-tools-setup.py "$JOB_DIRECTORY" "$JOB_IDENTITY"

      - name: Retain the actual native tool installation and closure receipt
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/launcher' &&
          contains(github.event.head_commit.message, '[release-tools-setup]')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tools-setup-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.private_job.outputs.directory }}/evidence/release-tools-setup.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain actual confined publisher CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publisher-checks-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ steps.private_job.outputs.directory }}/evidence/publisher-checks.txt
            ${{ steps.private_job.outputs.directory }}/evidence/lapkb-release-verifier
            ${{ steps.private_job.outputs.directory }}/evidence/lapkb-release-verifier.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Identity-confined cleanup of this private job only
        if: always()
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          JOB_DIRECTORY: ${{ steps.private_job.outputs.directory }}
          JOB_IDENTITY: ${{ steps.private_job.outputs.identity }}
        run: python3 scripts/ci/owned-temp-dir.py cleanup "$RUNNER_TEMP" "$JOB_DIRECTORY" publisher-jobs2 "$JOB_IDENTITY"

  coordinator-runtime:
    name: Verify the existing ARM64 coordinator runtime
    if: >-
      github.repository == 'LAPKB/desktop-releases' &&
      github.event_name == 'push' && github.ref == 'refs/heads/launcher' &&
      contains(github.event.head_commit.message, '[release-tools-setup]')
    runs-on:
      group: rust
      labels: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}-runtime
      - name: Create an identity-bound runtime evidence directory
        id: private_job
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}-runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          python3 -c 'import sys,tomllib; assert sys.version_info >= (3,11), "Coordinator requires Python 3.11+"'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          job="$(mktemp -d "$RUNNER_TEMP/publisher-jobs2.XXXXXXXXXX")"
          job="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$job")"
          chmod 700 "$job"
          identity="$(python3 -c 'import os,sys; s=os.lstat(sys.argv[1]); print(f"{s.st_dev}:{s.st_ino}")' "$job")"
          python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$job" publisher-jobs2 "$identity"
          printf 'directory=%s\nidentity=%s\n' "$job" "$identity" >> "$GITHUB_OUTPUT"
      - name: Record actual Python and protected OpenSSL CLI support without credentials
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}-runtime
        env:
          WORK: ${{ steps.private_job.outputs.directory }}
          IDENTITY: ${{ steps.private_job.outputs.identity }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/owned-temp-dir.py validate "$RUNNER_TEMP" "$WORK" publisher-jobs2 "$IDENTITY"
          python3 - <<'PY'
          import hashlib, json, os, stat, subprocess, sys, tomllib
          from pathlib import Path
          assert sys.version_info >= (3, 11)
          tool = Path('/usr/bin/openssl')
          assert tool.resolve(strict=True) == tool and tool.stat().st_uid == 0
          assert stat.S_ISREG(tool.stat().st_mode) and not tool.stat().st_mode & 0o022
          assert os.access(tool, os.X_OK)
          version = subprocess.run([str(tool), 'version'], check=True, capture_output=True,
                                   timeout=30, env={'PATH': '/usr/bin:/bin', 'LC_ALL': 'C'})
          assert version.stdout.startswith(b'OpenSSL ')
          receipt = {'publisherSource': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'runner': os.environ['RUNNER_NAME'],
              'runnerGroup': 'rust', 'architecture': 'Linux ARM64', 'python': sys.version,
              'pythonExecutable': sys.executable, 'tomllibImported': True,
              'opensslPath': str(tool), 'opensslVersion': version.stdout.decode().strip(),
              'opensslSha256': hashlib.sha256(tool.read_bytes()).hexdigest(),
              'actualAppAuthenticationOrReleaseClaimed': False, 'runtimeChanged': False}
          with (Path(os.environ['WORK']) / 'coordinator-runtime.json').open('x') as output:
              json.dump(receipt, output, sort_keys=True, indent=2)
              output.write('\n')
          print('Existing ARM64 Python 3.11+ and /usr/bin/openssl CLI checks passed; receipt retained.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordinator-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.private_job.outputs.directory }}/coordinator-runtime.json
          if-no-files-found: error
          retention-days: 30
      - name: Identity-confined cleanup of runtime scratch only
        if: always()
        working-directory: jobs/desktop-releases-${{ github.run_id }}-${{ github.run_attempt }}-runtime
        env:
          WORK: ${{ steps.private_job.outputs.directory }}
          IDENTITY: ${{ steps.private_job.outputs.identity }}
        run: python3 scripts/ci/owned-temp-dir.py cleanup "$RUNNER_TEMP" "$WORK" publisher-jobs2 "$IDENTITY"
